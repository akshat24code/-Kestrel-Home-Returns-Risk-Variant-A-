<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dispatch Check</title>
<style>
  :root { --ink:#1d2321; --muted:#5d6763; --line:#d9dedb; --bg:#f6f4ef; --card:#ffffff;
          --low:#2f7d4f; --elev:#b7791f; --high:#b4402f; --accent:#24443a; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif; color:var(--ink); background:var(--bg); }
  header { padding:18px 24px; border-bottom:1px solid var(--line); background:var(--card); display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
  header h1 { margin:0; font-size:19px; letter-spacing:.2px; }
  header span { color:var(--muted); font-size:13px; }
  main { display:grid; grid-template-columns: minmax(300px, 420px) 1fr; gap:20px; padding:20px 24px; max-width:1200px; margin:0 auto; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; padding:16px; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:18px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:0 0 12px; }
  label { display:block; font-size:12px; color:var(--muted); margin:8px 0 3px; }
  input, select { width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:6px; font:inherit; background:#fff; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .examples { display:flex; flex-direction:column; gap:6px; margin-bottom:10px; }
  .examples button { text-align:left; background:#eef1ee; border:1px solid var(--line); color:var(--ink); }
  button { cursor:pointer; padding:9px 14px; border-radius:6px; border:0; font:inherit; }
  .go { background:var(--accent); color:#fff; width:100%; margin-top:14px; font-weight:600; }
  .verdict { display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
  .prob { font-size:44px; font-weight:700; line-height:1; }
  .band { padding:4px 10px; border-radius:20px; color:#fff; font-weight:600; font-size:13px; text-transform:uppercase; letter-spacing:.05em; }
  .low { background:var(--low); } .elevated { background:var(--elev); } .high { background:var(--high); }
  .action { font-size:18px; font-weight:600; margin:14px 0 4px; }
  .muted { color:var(--muted); font-size:13px; }
  ul.reasons { list-style:none; padding:0; margin:10px 0 0; }
  ul.reasons li { display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); }
  .up { color:var(--high); font-weight:600; white-space:nowrap; } .down { color:var(--low); font-weight:600; white-space:nowrap; }
  .note { background:#fff6e5; border:1px solid #f0d8a8; padding:9px 12px; border-radius:6px; margin-top:12px; }
  .err { background:#fdecea; border:1px solid #f2c1bb; padding:9px 12px; border-radius:6px; }
  details { margin-top:14px; } pre { white-space:pre-wrap; font-size:12px; background:#f3f3f1; padding:10px; border-radius:6px; }
</style>
</head>
<body>
<header>
  <h1>Kestrel · Dispatch check</h1>
  <span>Return-risk score for one order, with the reasons. Recommendation: call, don't hold.</span>
</header>
<main>
  <section class="card">
    <h2>Try an order</h2>
    <div class="examples" id="examples"></div>
    <form id="f">
      <div class="row">
        <div><label>Order placed (IST)</label><input name="order_placed_at" value="2026-07-04 21:05"></div>
        <div><label>Customer ID</label><input name="customer_id" value="DEMO-C2"></div>
      </div>
      <div class="row">
        <div><label>SKU</label><select name="sku" id="sku"></select></div>
        <div><label>Channel</label><select name="sales_channel"><option>app</option><option>web</option><option>marketplace</option><option>partner_outlet</option></select></div>
      </div>
      <div class="row">
        <div><label>Payment</label><select name="payment_mode"><option>prepaid_upi</option><option>prepaid_card</option><option>cod</option><option>emi</option></select></div>
        <div><label>Discount %</label><input name="discount_pct" type="number" value="10"></div>
      </div>
      <div class="row">
        <div><label>Qty</label><input name="qty" type="number" value="1"></div>
        <div><label>Order value (Rs)</label><input name="order_value_inr" type="number" step="0.01" value="5849"></div>
      </div>
      <div class="row">
        <div><label>Promised days</label><input name="promised_delivery_days" type="number" value="5"></div>
        <div><label>Pincode (blank = none)</label><input name="delivery_pincode" value="411038"></div>
      </div>
      <div class="row">
        <div><label>Prior orders</label><input name="customer_prior_orders" type="number" value="0"></div>
        <div><label>Prior returns</label><input name="customer_prior_returns" type="number" value="0"></div>
      </div>
      <div class="row">
        <div><label>Gift?</label><select name="is_gift"><option>N</option><option>Y</option></select></div>
        <div><label>Shield member?</label><select name="shield_member"><option value="">look up</option><option>N</option><option>Y</option></select></div>
      </div>
      <label>Delivery note</label><input name="delivery_note" value="">
      <button class="go" type="submit">Score this order</button>
    </form>
  </section>
  <section class="card" id="out">
    <h2>Result</h2>
    <p class="muted">Pick an example or fill the form and press <b>Score this order</b>.</p>
  </section>
</main>
<script>
const SKUS = ["KH-AF-01","KH-AF-02","KH-AF-03","KH-MG-01","KH-MG-02","KH-MG-03","KH-WP-01","KH-WP-02","KH-WP-03",
  "KH-RV-01","KH-RV-02","KH-RV-03","KH-IC-01","KH-IC-02","KH-IC-03","KH-CF-01","KH-CF-02","KH-CF-03","KH-RH-01","KH-RH-02","KH-RH-03"];
const f = document.getElementById("f"), out = document.getElementById("out");
document.getElementById("sku").innerHTML = SKUS.map(s => `<option>${s}</option>`).join("");
f.sku.value = "KH-AF-02";
const NUM = ["discount_pct","qty","order_value_inr","promised_delivery_days","customer_prior_orders","customer_prior_returns"];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ACTION = { call_before_dispatch: "Call the customer before dispatch", ship_normally: "Ship normally" };

function fill(rec) {
  for (const el of f.elements) if (el.name && rec[el.name] !== undefined) el.value = rec[el.name];
}
fetch("/examples").then(r => r.json()).then(list => {
  const box = document.getElementById("examples");
  list.forEach(rec => {
    const b = document.createElement("button"); b.type = "button"; b.textContent = rec.label;
    b.onclick = () => { fill(rec); score(rec); }; box.appendChild(b);
  });
});

async function score(rec) {
  out.innerHTML = '<h2>Result</h2><p class="muted">Scoring…</p>';
  try {
    const r = await fetch("/score", { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(rec) });
    const d = await r.json();
    if (!d.ok) { out.innerHTML = `<h2>Result</h2><div class="err"><b>Can't score this order:</b><br>${d.errors.map(esc).join("<br>")}</div>`; return; }
    out.innerHTML = `
      <h2>Result ${d.order_id ? "· " + esc(d.order_id) : ""}</h2>
      <div class="verdict"><div class="prob">${Math.round(d.return_probability*100)}%</div>
        <span class="band ${d.risk_band}">${d.risk_band} risk</span>
        <span class="muted">${d.relative_to_average}× the average order</span></div>
      <div class="action">${ACTION[d.recommended_action]}</div>
      <div class="muted">${esc(d.explanation)} Expected value of calling: Rs ${d.expected_saving_from_call_inr}.</div>
      ${d.note ? `<div class="note">${esc(d.note)}</div>` : ""}
      <h2 style="margin-top:18px">Why</h2>
      <ul class="reasons">${d.reasons.map(x => `<li><span>${esc(x.factor)}</span><span class="${x.direction==="raises risk"?"up":"down"}">${x.direction}</span></li>`).join("") || "<li>Nothing stands out; close to an average order.</li>"}</ul>
      <details><summary class="muted">Raw response</summary><pre>${esc(JSON.stringify(d, null, 2))}</pre></details>`;
  } catch (e) {
    out.innerHTML = `<h2>Result</h2><div class="err">The scoring service isn't reachable. Is <code>python -m app.server</code> running?</div>`;
  }
}
f.onsubmit = e => {
  e.preventDefault();
  const rec = {};
  for (const el of f.elements) if (el.name && el.value !== "") rec[el.name] = NUM.includes(el.name) ? Number(el.value) : el.value;
  score(rec);
};
</script>
</body>
</html>
